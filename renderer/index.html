<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>LLM Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="translate">
          <span class="tab-icon">⇄</span>
          <span class="tab-label">번역</span>
        </button>
        <button class="tab-btn" data-tab="settings">
          <span class="tab-icon">⚙</span>
          <span class="tab-label">설정</span>
        </button>
        <button class="tab-btn" data-tab="tab3">
          <span class="tab-icon">☰</span>
          <span class="tab-label">기타</span>
        </button>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </nav>

    <!-- Content -->
    <main class="content">

      <!-- Tab 1: Translation -->
      <div class="tab-panel active" id="tab-translate">
        <div class="control-bar">
          <div class="lang-row">
            <select id="sourceLang"></select>
            <span class="mode-badge" id="modeBadge">번역</span>
            <select id="targetLang"></select>
          </div>
          <button class="submit-btn" id="submitBtn">전송</button>
        </div>
        <div class="panels">
          <div class="panel">
            <textarea id="inputText" placeholder="텍스트를 입력하세요..."></textarea>
          </div>
          <div class="panel result-panel">
            <div id="resultText" class="result-text"></div>
            <button class="copy-btn" id="copyBtn" style="display:none">복사</button>
          </div>
        </div>
        <div id="errorMsg" class="error-msg" style="display:none"></div>
      </div>

      <!-- Tab 2: Settings -->
      <div class="tab-panel" id="tab-settings">
        <div class="settings-wrap">
          <h2>Vertex AI 설정</h2>
          <div class="settings-section">
            <label class="settings-label">JSON 키</label>
            <div class="key-input-row">
              <button id="loadFileBtn">파일 불러오기</button>
              <span id="fileStatus" class="file-status">선택된 파일 없음</span>
              <input type="file" id="fileInput" accept=".json" style="display:none" />
            </div>
            <textarea id="keyTextarea" placeholder="또는 JSON 내용을 여기에 붙여넣으세요..." rows="6"></textarea>
            <div id="keyFeedback" class="key-feedback" style="display:none"></div>
          </div>
        </div>
      </div>

      <!-- Tab 3: TBD -->
      <div class="tab-panel" id="tab-tab3">
        <div class="placeholder">
          <span>준비 중</span>
        </div>
      </div>

    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
